[browser]
gatherUsageStats = false

[server]
headless = true

# Restrained, business-software look: white surfaces on a cool light-grey canvas, slate text,
# one accent (deep navy). Layout details (login photo, hero, cards, navigation) are in the single
# CSS block in app.py (THEME_CSS).
[theme]
base = "light"
primaryColor = "#1E3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#0F172A"
linkColor = "#1E3A5F"
borderColor = "#DDE2EA"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 16
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showSidebarBorder = true
chartCategoricalColors = ["#1E3A5F", "#3B82A0", "#B7791F", "#64748B", "#9B2C2C"]
