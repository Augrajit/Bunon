[pytest]
testpaths = tests
# The app click-through sweep (tests/test_app_sweep.py) takes several minutes: run it with `pytest -m sweep`.
addopts = -m "not sweep"
markers =
    sweep: slow click-through of app.py at extreme sidebar settings (opt-in: pytest -m sweep)
filterwarnings =
    ignore::DeprecationWarning:pulp.*
